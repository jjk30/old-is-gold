name: Deploy

on:
  push:
    branches: [main]

# Required for GitHub OIDC -> AWS role assumption (no long-lived AWS keys).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        env:
          # Public API base URL embedded at build time (not a secret).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://oldisgold-frontend --delete
          aws cloudfront create-invalidation \
            --distribution-id E1F1M9HXF6IJ7V --paths "/*"

  deploy-lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambda
        run: |
          cd backend
          mkdir -p build
          # Install deps as manylinux wheels matching the Lambda runtime.
          pip install \
            --platform manylinux2014_x86_64 \
            --target build \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: --upgrade \
            -r requirements.txt
          cp lambda_function.py auth.py build/
          cd build && zip -qr ../lambda.zip . && cd ..

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip
